<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Генератор іконок у стилі Adobe CC</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#1b1b1f;--mut:#6b6b76;--bd:#dcdce2;--ac:#3b6cff;--chk1:#e9e9ee;--chk2:#fafafc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121215;--card:#1c1c21;--tx:#ececf1;--mut:#9a9aa6;--bd:#33333b;--chk1:#26262c;--chk2:#1f1f24}}
:root[data-theme="dark"]{--bg:#121215;--card:#1c1c21;--tx:#ececf1;--mut:#9a9aa6;--bd:#33333b;--chk1:#26262c;--chk2:#1f1f24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stage{display:flex;align-items:center;justify-content:center;border-radius:10px;padding:24px;
background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/20px 20px}
#main{width:min(100%,420px);aspect-ratio:1;height:auto}
.mini{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin-top:14px;color:var(--mut);font-size:12px}
.mini div{text-align:center}.mini canvas{display:block;margin:0 auto 4px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text]{width:100%;font:700 22px "Source Sans 3",sans-serif;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=range]{width:100%}
select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
input[type=color]{width:100%;height:38px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:2px}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;border:0;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:600 15px inherit;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.gal{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.gal canvas{width:60px;height:60px;cursor:pointer;border-radius:12px;transition:transform .12s}
.gal canvas:hover{transform:scale(1.08)}
h2{font-size:16px;margin:0}
.glab{flex-basis:100%;font-size:13px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Генератор іконок Adobe CC</h1>
<p class="sub">Вводь літери, обирай кольори й стиль, завантажуй PNG. Текст автоматично підбирає розмір.</p>
<div class="grid">
 <div>
  <div class="card">
   <div class="stage"><canvas id="main" width="840" height="840"></canvas></div>
   <div class="mini" id="mini"></div>
  </div>
  <div class="card" style="margin-top:16px">
   <h2>Готові шаблони</h2>
   <div class="gal" id="gal"></div>
  </div>
 </div>
 <div class="card">
  <label style="margin-top:0">Текст (1–3 символи)</label>
  <input type="text" id="text" value="Ps" maxlength="3" autocomplete="off" spellcheck="false">
  <label>Стиль</label>
  <div class="seg" id="style">
   <button data-v="2019" class="on">CC 2019</button><button data-v="2020">CC 2020</button><button data-v="new">Нові</button>
  </div>
  <div class="row">
   <div><label>Колір букв / акцент</label><input type="color" id="accent" value="#31a8ff"></div>
   <div><label>Колір фону</label><input type="color" id="bg" value="#001e36"></div>
  </div>
  <label>Заокруглення: <span id="rv">22</span>%</label>
  <input type="range" id="radius" min="0" max="50" value="22">
  <div class="seg" id="rpre" style="margin-top:6px"><button data-r="0">Квадрат</button><button data-r="12">Легке</button><button data-r="22">Adobe</button><button data-r="32">М’яке</button><button data-r="50">Коло</button></div>
  <label>Розмір тексту: <span id="sv">100</span>%</label>
  <input type="range" id="scale" min="50" max="130" value="100">
  <div class="row">
   <div><label>Товщина</label><select id="weight"><option value="400">Regular</option><option value="600">Semibold</option><option value="700" selected>Bold</option><option value="900">Black</option></select></div>
   <div><label>Розмір PNG</label><select id="size"><option>128</option><option>256</option><option>512</option><option selected>1024</option><option>2048</option></select></div>
  </div>
  <div class="btns"><button class="btn" id="rnd">Випадковий</button><button class="btn p" id="dl">Завантажити PNG</button></div>
 </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const FONT='"Source Sans 3","Adobe Clean",system-ui,"Segoe UI",Arial,sans-serif';
const P=[['Ps','#31A8FF','#001E36'],['Ai','#FF9A00','#330000'],['Id','#FF3366','#49021F'],['Pr','#9999FF','#00005B'],['Ae','#9999FF','#00005B'],['Lr','#4FB6FF','#001A26'],['Xd','#FF61F6','#470137'],['Au','#00E4BB','#00192E'],['Ac','#FF2A1F','#2A0000'],['Dw','#35FA00','#072401'],['An','#EA77FF','#31001B'],['Me','#EA77FF','#00005B'],['Br','#A7C2E8','#001E36'],['Dn','#6CD8FF','#00192E'],['Fl','#FF3B30','#2A0000'],['Ic','#FF7BAC','#3A0018']];
const S={text:'Ps',accent:'#31a8ff',bg:'#001e36',style:'2019',radius:22,scale:100,weight:700};

function rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const x=rgb(a),y=rgb(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function hsl(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function draw(c,s,o){
  c.clearRect(0,0,s,s);
  const R=s*o.radius/100/1.0*0.5*1.0*2*0.5; // radius in px (percent of side)
  const r=s*o.radius/100;
  let tc=o.accent;
  if(o.style==='2019'){
    rr(c,0,0,s,s,r);c.fillStyle=o.bg;c.fill();
    const w=s*0.03;rr(c,w/2+s*0.012,w/2+s*0.012,s-w-s*0.024,s-w-s*0.024,Math.max(0,r-w*0.9));
    c.lineWidth=w;c.strokeStyle=o.accent;c.stroke();
  }else if(o.style==='2020'){
    rr(c,0,0,s,s,r);
    const g=c.createLinearGradient(0,0,0,s);g.addColorStop(0,mix(o.bg,'#ffffff',.08));g.addColorStop(1,o.bg);
    c.fillStyle=g;c.fill();
  }else{
    rr(c,0,0,s,s,r);
    const g=c.createLinearGradient(0,0,s,s);g.addColorStop(0,mix(o.accent,'#ffffff',.25));g.addColorStop(1,mix(o.accent,o.bg,.65));
    c.fillStyle=g;c.fill();
    c.save();rr(c,0,0,s,s,r);c.clip();
    const q=c.createRadialGradient(s*.2,s*.1,0,s*.2,s*.1,s*.95);q.addColorStop(0,'rgba(255,255,255,.4)');q.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=q;c.fillRect(0,0,s,s);c.restore();
    tc='#ffffff';
  }
  const t=o.text.trim();if(!t)return;
  const k=o.scale/100;
  c.textAlign='left';c.textBaseline='alphabetic';c.fillStyle=tc;
  c.font=`${o.weight} 100px ${FONT}`;c.letterSpacing='-2px';
  const w0=c.measureText(t).width||1;
  const fs=Math.min(100*s*0.6*k/w0,s*0.62*k);
  c.font=`${o.weight} ${fs}px ${FONT}`;c.letterSpacing=(-0.02*fs)+'px';
  const m=c.measureText(t);
  const x=s/2-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2-m.actualBoundingBoxLeft*0;
  const y=s/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
  if(o.style==='new'){c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=s*0.02;c.shadowOffsetY=s*0.008}
  c.fillText(t,x,y);c.shadowColor='transparent';
}

function hi(cv,css){const d=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(css*d);return cv}
function render(){
  draw($('main').getContext('2d'),840,S);
  const mini=$('mini');if(!mini.children.length){[128,64,32,16].forEach(n=>{const d=document.createElement('div');d.innerHTML=`<canvas data-n="${n}" style="width:${n}px;height:${n}px"></canvas>${n}`;mini.appendChild(d)})}
  mini.querySelectorAll('canvas').forEach(cv=>{const n=+cv.dataset.n;hi(cv,n);draw(cv.getContext('2d'),cv.width,S)});
  renderGal();
}
const ERAS=[['2019','CC 2019',18],['2020','CC 2020',22],['new','Нові',30]];
function renderGal(){
  const g=$('gal');
  if(!g.children.length)ERAS.forEach(e=>{
    const l=document.createElement('div');l.className='glab';l.textContent=e[1];g.appendChild(l);
    P.forEach(p=>{const cv=document.createElement('canvas');cv.title=p[0]+' · '+e[1];
      cv.onclick=()=>{S.text=p[0];S.accent=p[1].toLowerCase();S.bg=p[2].toLowerCase();S.style=e[0];S.radius=e[2];sync();render()};
      cv._p=p;cv._e=e;g.appendChild(cv)})});
  [...g.querySelectorAll('canvas')].forEach(cv=>{hi(cv,60);const p=cv._p,e=cv._e;draw(cv.getContext('2d'),cv.width,{...S,text:p[0],accent:p[1],bg:p[2],style:e[0],radius:e[2]})});
}
function sync(){$('text').value=S.text;$('accent').value=S.accent;$('bg').value=S.bg;$('radius').value=S.radius;$('scale').value=S.scale;$('weight').value=S.weight;$('rv').textContent=S.radius;$('sv').textContent=S.scale;
  document.querySelectorAll('#rpre button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.radius));
  document.querySelectorAll('#style button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.style))}

$('text').oninput=e=>{S.text=e.target.value;render()};
$('accent').oninput=e=>{S.accent=e.target.value;render()};
$('bg').oninput=e=>{S.bg=e.target.value;render()};
$('radius').oninput=e=>{S.radius=+e.target.value;$('rv').textContent=S.radius;render()};
document.querySelectorAll('#rpre button').forEach(b=>b.onclick=()=>{S.radius=+b.dataset.r;sync();render()});
$('scale').oninput=e=>{S.scale=+e.target.value;$('sv').textContent=S.scale;render()};
$('weight').onchange=e=>{S.weight=+e.target.value;loadFont().then(render)};
document.querySelectorAll('#style button').forEach(b=>b.onclick=()=>{S.style=b.dataset.v;sync();render()});
$('rnd').onclick=()=>{const h=Math.floor(Math.random()*360),R=Math.random;
  S.style=['2019','2020','new'][Math.floor(R()*3)];
  S.radius=Math.round(10+R()*30);
  S.accent=hsl(h,85+Math.round(R()*15),55+Math.round(R()*12));
  S.bg=hsl((h+Math.round((R()-.5)*60)+360)%360,90+Math.round(R()*10),6+Math.round(R()*8));
  S.weight=[600,700,700,900][Math.floor(R()*4)];
  sync();render()};
$('dl').onclick=()=>{
  const n=+$('size').value,cv=document.createElement('canvas');cv.width=cv.height=n;draw(cv.getContext('2d'),n,S);
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.text||'icon')+'-'+S.style+'-'+n+'.png';document.body.appendChild(a);a.click();a.remove()},'image/png');
};
function loadFont(){return Promise.all([400,600,700,900].map(w=>document.fonts.load(`${w} 100px "Source Sans 3"`,'PsAi'))).catch(()=>{})}
sync();render();loadFont().then(render);
</script>
</body>
</html>
